work_dir: work_dir/MS-AimCLR/lin_eval/1_joint_kinectground+smplx42_fullrandom_extended_xsub_ensemble

# weights: /data/gty/released_model/ntu60_xsub_bone.pt
weights: work_dir/MS-AimCLR/X-Sub/1_joint_kinectground+smplx42_fullrandom_extended/epoch300_model.pt
ignore_weights: [encoder_q.fc, encoder_k, queue]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_ensemble
train_feeder_args:
  data_path: 
    ntu-rgb+d: /data/datasets/NTU60_frame50_rotated/xsub/train_position.npy
    smplx_42: /data/datasets/NTU60_smplx42_Metrabs_frame50/xsub/train_position.npy
  label_path: /data/datasets/NTU-RGB-D/xsub/train_label.pkl
  shear_amplitude: -1
  temperal_padding_ratio: -1
  mmap: True
test_feeder: feeder.ntu_feeder.Feeder_ensemble
test_feeder_args:
  data_path: 
    ntu-rgb+d: /data/datasets/NTU60_frame50_rotated/xsub/val_position.npy
    smplx_42: /data/datasets/NTU60_smplx42_Metrabs_frame50/xsub/val_position.npy
  label_path: /data/datasets/NTU-RGB-D/xsub/val_label.pkl
  shear_amplitude: -1
  temperal_padding_ratio: -1
  mmap: True

# model
model: net.aimclr.AimCLR
model_args:
  base_encoder: net.st_gcn_flex.FlexModel
  pretrain: False
  ensemble: True
  skeletons:
  - ntu-rgb+d
  - smplx_42
  # feature_dim: 128
  # queue_size: 32768
  # momentum: 0.999
  # Temperature: 0.07
  # mlp: True
  in_channels: 3
  hidden_channels: 16
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True

# optim
nesterov: False
weight_decay: 0.0
base_lr: 3.
optimizer: SGD
step: [80]

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 100
stream: 'joint'

# log
save_interval: -1
eval_interval: 5
